<style>
:root{--parchment:#F3F0E2;--ink:#1C2A1E;--ink-2:#465843;--moss:#2E4A33;--on-moss:#F7F4E8;--line:rgba(28,42,30,.16)}
@media (prefers-color-scheme: dark){:root{--parchment:#101610;--ink:#EDE8D6;--ink-2:#B6BFAF;--moss:#2C4630;--on-moss:#EDE8D6;--line:rgba(237,232,214,.18)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:"Alegreya Sans",system-ui,sans-serif;font-size:1.08rem;line-height:1.6;
  display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
main{max-width:34rem;text-align:center}
img{width:132px;height:132px;border-radius:50%;margin:0 auto 26px;display:block;box-shadow:0 0 0 1px var(--line)}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(2.2rem,1.6rem + 2.6vw,3.2rem);line-height:1.05;margin:0 0 14px}
p{margin:0 0 1em;color:var(--ink-2)}
.sign{font-family:Parisienne,cursive;font-size:2.1rem;color:var(--ink);margin:6px 0 26px}
a.btn{display:inline-block;background:var(--moss);color:var(--on-moss);text-decoration:none;padding:13px 26px;border-radius:999px}
.small{font-size:.92rem;margin-top:22px}
.small a{color:var(--ink)}
</style>
